<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pegglecito Online</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { margin: 0; background: #0b0b14; color: #eee; display: grid; place-items: center; min-height: 100vh; }
      main { width: min(100vw - 32px, 800px); }
      #setup { text-align: center; line-height: 1.5; }
      #setup code { background: #222; padding: 2px 6px; border-radius: 4px; }
      label.button, button, select { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #444; background: #1d1d2b; color: inherit; cursor: pointer; }
      .bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
      canvas { width: 100%; aspect-ratio: 4 / 3; display: block; image-rendering: auto; background: #000; }
      #status { color: #f99; min-height: 1.5em; }
    </style>
  </head>
  <body>
    <main>
      <section id="setup">
        <h1>Pegglecito Online</h1>
        <p>Para jugar necesitás tu copia de <b>Peggle Nights</b>.<br />
          Elegí el archivo <code>main.pak</code> de la carpeta del juego<br />
          (opcional: también los <code>.pak</code> de <code>levelpacks/</code>).</p>
        <p>Los archivos se leen en tu navegador y no se suben a ningún lado.</p>
        <label class="button">Elegir archivos .pak<input id="pak-input" type="file" accept=".pak" multiple hidden /></label>
        <p id="status"></p>
      </section>
      <section id="viewer" hidden>
        <div class="bar">
          <select id="level"></select>
          <button id="reroll">Sortear colores</button>
          <button id="pause">Pausa</button>
          <button id="forget">Olvidar archivos</button>
        </div>
        <canvas id="screen" width="800" height="600"></canvas>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
